<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Стыковка с орбитальной станцией</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

  <header id="hud">
    <div class="hud-item"><span>Расстояние</span><b id="hud-dist">220.0</b></div>
    <div class="hud-item"><span>Скорость</span><b id="hud-speed">30.0</b></div>
    <div class="hud-item"><span>Сближение</span><b id="hud-closing">-30.0</b></div>
    <div class="hud-item"><span>Время</span><b id="hud-time">0.0</b></div>
    <div class="hud-item"><span>ΔV</span><b id="hud-dv">0.0</b></div>
    <div class="hud-item"><span>Топливо</span><b id="hud-fuel">30.0 / 30</b></div>
  </header>

  <canvas id="canvas"></canvas>

  <div id="mission-panel">
    <div id="mission-name">Миссия: Свободный полёт</div>
    <div id="stars">
      <span class="star" data-i="0">★</span>
      <span class="star" data-i="1">★</span>
      <span class="star" data-i="2">★</span>
    </div>
    <div id="objective">Цель: состыковаться с целью</div>
  </div>

  <div id="menu-buttons">
    <button id="open-missions">Миссии</button>
    <button id="open-satellites">Спутник</button>
  </div>

  <div id="touch-controls">
    <div class="pad">
      <button data-dir="up">▲</button>
      <div class="row">
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
    </div>
    <div class="actions">
      <button id="btn-impulse">Импульс</button>
      <button id="btn-restart">Заново</button>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Выбор миссии</h2>
      <div id="modal-body"></div>
      <button id="modal-close">Закрыть</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
